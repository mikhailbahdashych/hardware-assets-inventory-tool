name: Release

# A tag is the release. `git tag vX.Y.Z && git push --tags` builds and publishes
# ghcr.io/<owner>/<repo>:X.Y.Z, :X.Y and :latest — nothing else is required, and
# nothing publishes from a branch. A pre-release tag (vX.Y.Z-rc.1) publishes
# :X.Y.Z-rc.1 alone: it moves neither :X.Y nor :latest.
on:
  push:
    tags: ['v*.*.*']

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # arm64 as well as amd64: a lot of self-hosting happens on a Pi or an
      # ARM VPS, and emulated builds are slow but rare (one per release).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest=auto` puts :latest on a release and never on a pre-release,
          # which the old unconditional `type=raw,value=latest` did; the
          # semver {{major}}.{{minor}} pattern already skips pre-releases.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
