name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: inventory_test
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      JWT_ACCESS_SECRET: ci-only-secret
      JWT_REFRESH_SECRET: ci-only-secret
      APP_ENCRYPTION_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared package
        run: npm run build -w @inventory/shared

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: API unit tests
        run: npm run test -w @inventory/api

      - name: API e2e tests
        run: npm run test:e2e

      - name: Migration drift check
        run: npm run migration:run && npm run migration:check

      - name: Web tests (headless)
        run: npm run test:ci -w @inventory/web

      - name: Build all
        run: npm run build
