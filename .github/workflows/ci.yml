name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

  # The second engine, against a real server. Deliberately its own job rather
  # than a matrix leg on `ci`: the SQLite path is the canonical full gate — it
  # is what the image and the e2e journeys run on — and a failure here has to
  # say "Postgres" in its name rather than hide in a matrix cell. The suite is
  # the same one; `DATABASE_URL` is the whole difference, and `test/helpers.ts`
  # gives every test a database of its own on this server.
  api-tests-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without the health check the first test races the server's own boot.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The maintenance database: the helpers connect here to create and drop
      # each test's own, so this account needs CREATEDB, which the image's
      # superuser has.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: API tests on PostgreSQL
        run: npm test -w apps/api

  # The artifact people actually run. Built and started for real, because a
  # Dockerfile that only compiles is a Dockerfile nobody has tried.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: inventory:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it on a fresh volume
        run: |
          # The image runs as uid 1000 and may not chown its bind mount, so the
          # directory has to arrive owned by it — the runner's own user is not 1000.
          mkdir -p /tmp/inventory-data
          sudo chown -R 1000:1000 /tmp/inventory-data
          docker run -d --name inventory \
            -p 3000:3000 -v /tmp/inventory-data:/data \
            -e APP_URL=http://localhost:3000 inventory:ci

      - name: Wait for the healthcheck to pass
        run: timeout 60 bash -c 'until curl -sf http://localhost:3000/api/v1/healthz; do sleep 2; done'

      # The point of the whole arrangement: a shell into the instance is not a
      # root shell.
      - name: Nothing in there is root
        run: test "$(docker exec inventory id -u)" = "1000"

      - name: Set up a workspace and read it back
        run: |
          set -euo pipefail
          curl -sf -X POST http://localhost:3000/api/v1/setup \
            -H 'content-type: application/json' -H 'origin: http://localhost:3000' \
            -d '{"orgName":"CI","name":"CI Admin","email":"ci@example.com","password":"correct-horse-battery"}' \
            -c /tmp/cookies > /dev/null
          curl -sf http://localhost:3000/api/v1/meta | grep -q '"needsSetup":false'
          # The SPA is served by the same process, deep links included.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/assets)" = 200

      - name: Survive a restart with its data
        run: |
          set -euo pipefail
          docker restart inventory
          timeout 60 bash -c 'until curl -sf http://localhost:3000/api/v1/healthz; do sleep 2; done'
          curl -sf http://localhost:3000/api/v1/meta | grep -q '"orgName":"CI"'

      - name: Container logs
        if: always()
        run: docker logs inventory

  # The infrastructure, checked the only way configuration can be checked
  # without an account to apply it against: it parses, it is formatted, and
  # every resource, attribute and provider name in it is one that exists.
  # `init -backend=false` is what makes that possible: it downloads the
  # providers whose schemas `validate` checks the configuration against, and
  # touches no state, no credentials and nothing in AWS.
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          # Pinned to the line the committed .terraform.lock.hcl was written
          # by, so CI resolves the same providers a laptop does.
          terraform_version: '~1.14.0'

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
